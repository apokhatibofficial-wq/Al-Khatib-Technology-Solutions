name: tak-c-taxi CI

on:
  push:
    branches: [main]
    paths: ["tak-c-taxi/**"]
  pull_request:
    paths: ["tak-c-taxi/**"]

defaults:
  run:
    working-directory: tak-c-taxi

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tak_c_taxi
          POSTGRES_PASSWORD: tak_c_taxi
          POSTGRES_DB: tak_c_taxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tak_c_taxi -d tak_c_taxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CHECKPOINT_DISABLE: "1"
      DATABASE_URL: postgresql://tak_c_taxi:tak_c_taxi@localhost:5432/tak_c_taxi_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-use-32chars
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-use-32char
      NODE_ENV: test
      PGPASSWORD: tak_c_taxi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tak-c-taxi/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CREATE EXTENSION postgis does not reliably populate spatial_ref_sys
      # on every PostGIS packaging (a real bug this project hit once — see
      # README.md's Prerequisites section). Rather than depend on this
      # image's behavior or reach into its filesystem for the seed script,
      # this inserts the one SRID the whole schema actually uses (4326,
      # WGS84) directly — a stable, standard EPSG definition, not something
      # that changes. ON CONFLICT DO NOTHING makes it a no-op if the image
      # already had it.
      - name: Ensure PostGIS extension + SRID 4326
        run: |
          psql -h localhost -U tak_c_taxi -d tak_c_taxi_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U tak_c_taxi -d tak_c_taxi_test -v ON_ERROR_STOP=1 -c "
            INSERT INTO spatial_ref_sys (srid, auth_name, auth_srid, srtext, proj4text) VALUES (
              4326, 'EPSG', 4326,
              'GEOGCS[\"WGS 84\",DATUM[\"WGS_1984\",SPHEROID[\"WGS 84\",6378137,298.257223563,AUTHORITY[\"EPSG\",\"7030\"]],AUTHORITY[\"EPSG\",\"6326\"]],PRIMEM[\"Greenwich\",0,AUTHORITY[\"EPSG\",\"8901\"]],UNIT[\"degree\",0.0174532925199433,AUTHORITY[\"EPSG\",\"9122\"]],AUTHORITY[\"EPSG\",\"4326\"]]',
              '+proj=longlat +datum=WGS84 +no_defs'
            ) ON CONFLICT (srid) DO NOTHING;"

      - name: Apply migrations
        run: npm run db:deploy

      - name: Typecheck (src + test)
        run: npm run typecheck:test

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
